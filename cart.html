<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - MySimpleStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">
    <header class="bg-gray-800 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">MySimpleStore</a>
            <nav id="main-nav" class="flex space-x-4 items-center">
                <!-- Navigation will be populated by JavaScript -->
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Your Shopping Cart</h1>
        <div class="cart-container bg-white p-6 md:p-8 shadow-lg rounded-lg">
            <div class="cart-items">
                <!-- Cart items will be rendered here by JavaScript -->
                <p class="text-gray-600 text-center">Loading cart...</p>
            </div>
            <div class="mt-6 border-t pt-4">
                <div class="flex justify-end items-center">
                    <h3 class="text-xl font-semibold text-gray-800 mr-4">Total:</h3>
                    <span id="cart-total" class="text-2xl font-bold text-blue-600">$0.00</span>
                </div>
                <div class="mt-6 text-right">
                    <a href="checkout.html" class="bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 ease-in-out text-lg">
                        Proceed to Checkout
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white text-center p-4 mt-8">
        <p>&copy; 2023 MySimpleStore. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
