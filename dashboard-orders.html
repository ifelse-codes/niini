<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - MySimpleStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">
    <header class="bg-gray-800 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">MySimpleStore</a>
            <nav id="main-nav" class="flex space-x-4 items-center">
                <!-- Navigation will be populated by JavaScript -->
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-10">Manage Your Orders</h1>

        <section id="orders-section" class="bg-white p-6 md:p-8 shadow-lg rounded-lg">
            <h2 class="text-2xl font-semibold text-gray-700 mb-6">Incoming Orders</h2>
            <div id="store-order-list" class="space-y-6">
                <!-- Orders will be listed here by JavaScript -->
                <p class="text-gray-500 text-center">Loading your orders...</p>
            </div>
        </section>
    </main>

    <footer class="bg-gray-800 text-white text-center p-4 mt-12">
        <p>&copy; 2023 MySimpleStore. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
