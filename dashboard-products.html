<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - MySimpleStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">
    <header class="bg-gray-800 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">MySimpleStore</a>
            <nav id="main-nav" class="flex space-x-4 items-center">
                <!-- Navigation will be populated by JavaScript -->
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-10">Manage Your Products</h1>

        <!-- Add New Product Section -->
        <section id="add-new-product-section" class="mb-12 bg-white p-6 md:p-8 shadow-lg rounded-lg">
            <h2 class="text-2xl font-semibold text-gray-700 mb-6">Add New Product</h2>
            <form id="add-product-form" class="space-y-6">
                <div>
                    <label for="productName" class="block text-sm font-medium text-gray-700">Product Name:</label>
                    <input type="text" id="productName" name="productName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="productDescription" class="block text-sm font-medium text-gray-700">Description:</label>
                    <textarea id="productDescription" name="productDescription" rows="3" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></textarea>
                </div>
                <div>
                    <label for="productPrice" class="block text-sm font-medium text-gray-700">Price ($):</label>
                    <input type="number" id="productPrice" name="productPrice" step="0.01" min="0" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="productImageUrl" class="block text-sm font-medium text-gray-700">Image URL (Optional):</label>
                    <input type="url" id="productImageUrl" name="productImageUrl" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="https://example.com/image.jpg">
                </div>
                <div>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150 ease-in-out">
                        Add Product
                    </button>
                </div>
            </form>
        </section>

        <!-- Your Products Section -->
        <section id="your-products-section">
            <h2 class="text-2xl font-semibold text-gray-700 mb-6">Your Products</h2>
            <div id="store-product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Products will be listed here by JavaScript -->
                <p class="text-gray-500 col-span-full text-center">Loading your products...</p>
            </div>
        </section>
    </main>

    <footer class="bg-gray-800 text-white text-center p-4 mt-12">
        <p>&copy; 2023 MySimpleStore. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
