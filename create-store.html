<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Store - Niini</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 min-h-screen flex flex-col">
    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">Niini</a>
            <nav id="main-nav" class="main-nav">
                <!-- Navigation will be populated by JavaScript -->
            </nav>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:block"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow container py-8 px-4 flex justify-center items-center">
        <div class="w-full max-w-lg animate-fade-in">
            <h1 class="section-title mb-8 text-center">Create Your Store</h1>
            <div class="card">
                <div class="card-body">
                    <form id="create-store-form" class="space-y-6">
                        <div class="form-group">
                            <label for="storeName" class="form-label">
                                <i class="fas fa-store text-primary-500 mr-2"></i> Store Name
                            </label>
                            <input type="text" id="storeName" name="storeName" required 
                                class="form-input" 
                                placeholder="Alice's Magical Emporium">
                        </div>

                        <div class="form-group">
                            <label for="whatsappNumber" class="form-label">
                                <i class="fab fa-whatsapp text-primary-500 mr-2"></i> WhatsApp Number (with country code)
                            </label>
                            <input type="tel" id="whatsappNumber" name="whatsappNumber" required 
                                class="form-input" 
                                placeholder="+12345678900">
                            <p class="text-xs text-gray-600 dark:text-gray-400 mt-1 ml-6">Include your country code, e.g., +1 for USA.</p>
                        </div>

                        <div class="pt-4">
                            <button type="submit" class="btn btn-primary w-full">
                                <i class="fas fa-plus-circle mr-2"></i> Create Store
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2023 Niini. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Dark mode toggle functionality
        document.getElementById('theme-toggle').addEventListener('click', function() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
        
        // Check for saved theme preference or respect OS preference
        if (localStorage.getItem('theme') === 'dark' || 
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
