<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="style.css">
    <title>E-commerce Home</title>
</head>
<body class="bg-gray-100">
    <header class="bg-gray-800 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">MySimpleStore</a>
            <nav id="main-nav" class="flex space-x-4 items-center">
                <!-- Navigation will be populated by JavaScript -->
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div id="store-list-container" class="my-8">
            <!-- Store list will be rendered here by JavaScript -->
        </div>
        <div id="product-list-heading" class="text-3xl font-bold text-center text-gray-800 my-8">
            <!-- Product list heading will be set by JavaScript -->
        </div>
        <div class="product-list grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Products will be rendered here by JavaScript -->
            <p class="text-gray-600 col-span-full text-center">Loading products...</p>
        </div>
    </main>

    <footer class="bg-gray-800 text-white text-center p-4 mt-8">
        <p>&copy; 2023 MySimpleStore. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
